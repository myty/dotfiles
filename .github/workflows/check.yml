name: Check

on:
  push:
  pull_request:

jobs:
  nu-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - name: Install dotfiles
        shell: nu {0}
        run: nu install.nu
      - name: Parse-check nushell files
        shell: nu {0}
        run: |
          # glob returns absolute paths; nu-check resolves relative ones
          # against this script's temp directory, not the repo.
          let failed = (
            glob "{nushell/*.nu,install.nu}"
            | where {|file| not (nu-check $file) }
          )
          if ($failed | is-not-empty) {
            print $"Parse errors in: ($failed | str join ', ')"
            exit 1
          }
          print "All files parse"
