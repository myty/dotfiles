name: Check

on:
  push:
  pull_request:

jobs:
  nu-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - name: Install dotfiles
        shell: nu {0}
        run: nu install.nu
      - name: Parse-check nushell files
        shell: nu {0}
        run: |
          glob nushell/*.nu | append install.nu | each {|f|
            print $"checking ($f)"
            nu-check --debug $f
          } | all {|ok| $ok } | if not $in { exit 1 }
